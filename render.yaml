databases:
  - name: news-portal-db
    plan: free
    databaseName: newsportal
    user: newsportal_user

services:
  - type: web
    name: news-portal-django
    runtime: python
    plan: free
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate && python manage.py ensure_superuser
    startCommand: gunicorn onps.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-portal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "news-portal-django.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://news-portal-django.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.10"
